- text: "The tether snaps, the silence loud"
  translation: "Привязь рвётся, тишина громка"

- text: "I will scream my name into the crowd"
  translation: "Я прокричу своё имя в толпу"

- text: "So tonight I'll give you a sign"
  translation: "Так что сегодня ночью я подам тебе знак"

- text: "This city's a graveyard, alive but decayed"
  translation: "Этот город — кладбище, живой, но разложившийся"

- text: "Walking side by side, but still"
  translation: "Идём бок о бок, но всё же"

